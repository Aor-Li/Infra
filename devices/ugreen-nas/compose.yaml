# UGOS Pro Docker 项目配置；设备状态与验收记录见同目录 README.md。
services:
  tailscale:
    image: ghcr.io/tailscale/tailscale:stable
    container_name: tailscale
    hostname: ugreen-nas
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_HOSTNAME: ugreen-nas
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: --accept-dns=false
    volumes:
      - tailscale-state:/var/lib/tailscale
volumes:
  tailscale-state:
