keys:
  - &aor age1798tthk6r4w0q5pxz9hhzd4ughmut0klknkx7zwzyt8ruegyv42q03w0vj

creation_rules:
  # 用户级密文：entity/users/<userName>/secrets.yaml
  - path_regex: (?:.*/)?entity/users/[^/]+/secrets\.yaml$
    key_groups:
      - age:
          - *aor

  # 系统级密文：entity/hosts/<hostName>/secrets.yaml
  # TODO: 目前暂用 aor 的个人 age key 加密；待各主机生成自己的 age key 后，
  #       改为按主机分别列出 recipient（主机 key + aor key），
  #       使主机只能解开自己的 secrets。
  - path_regex: (?:.*/)?entity/hosts/[^/]+/secrets\.yaml$
    key_groups:
      - age:
          - *aor
